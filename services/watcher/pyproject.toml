[project]
name = "kenn-watcher"
version = "0.0.0"
description = "Weekly watcher for the Israeli government pages each KB item cites. It proposes; a human merges."
requires-python = ">=3.13"
dependencies = [
  "httpx==0.28.1",
  "trafilatura==2.3.1",
  "PyGithub==2.10.0",
  "anthropic==2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kenn_watcher"]

[tool.ruff]
line-length = 90
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# S101: pytest needs bare asserts.
per-file-ignores = { "tests/**" = ["S101"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
